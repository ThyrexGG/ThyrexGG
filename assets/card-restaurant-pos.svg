<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" width="420" height="200" role="img" aria-label="Restaurant POS: QR table ordering, live orders and a Flutter POS app.">
<defs>
  <linearGradient id="g-restaurant-pos" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffa657"/><stop offset="1" stop-color="#3fb950"/></linearGradient>
  <linearGradient id="bg-restaurant-pos" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#151b2b"/></linearGradient>
  <radialGradient id="o-restaurant-pos"><stop offset="0" stop-color="#3fb950" stop-opacity="0.32"/><stop offset="1" stop-color="#3fb950" stop-opacity="0"/></radialGradient>
  <pattern id="p-restaurant-pos" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#ffa657" stroke-opacity="0.07"/></pattern>
  <clipPath id="f-restaurant-pos"><rect width="420" height="200" rx="16"/></clipPath>
</defs>
<g clip-path="url(#f-restaurant-pos)" font-family="ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace">
  <rect width="420" height="200" fill="url(#bg-restaurant-pos)"/>
  <rect width="420" height="200" fill="url(#p-restaurant-pos)"/>
  <circle cy="40" r="120" fill="url(#o-restaurant-pos)"><animate attributeName="cx" values="360;300;360" dur="9s" repeatCount="indefinite"/></circle>
  <rect width="420" height="4" fill="url(#g-restaurant-pos)"/>
  <text x="24" y="34" font-size="12" fill="#8b949e">// 05 · real-time / pos</text>
  <text x="24" y="78" font-size="32" font-weight="800" fill="url(#g-restaurant-pos)">Restaurant POS</text>
  <text x="24" y="104" font-size="13" fill="#c9d1d9">QR table ordering, live orders</text>
  <text x="24" y="122" font-size="13" fill="#c9d1d9">and a Flutter POS app.</text>
  <rect x="24" y="150" width="59" height="26" rx="13" fill="#ffa657" fill-opacity="0.12" stroke="#ffa657" stroke-opacity="0.55"/><text x="53.5" y="167" text-anchor="middle" font-size="12" fill="#e6edf3">React</text><rect x="91" y="150" width="88" height="26" rx="13" fill="#ffa657" fill-opacity="0.12" stroke="#ffa657" stroke-opacity="0.55"/><text x="135.0" y="167" text-anchor="middle" font-size="12" fill="#e6edf3">Socket.IO</text><rect x="187" y="150" width="73" height="26" rx="13" fill="#ffa657" fill-opacity="0.12" stroke="#ffa657" stroke-opacity="0.55"/><text x="223.5" y="167" text-anchor="middle" font-size="12" fill="#e6edf3">Flutter</text>
</g>
<rect x="1" y="1" width="418" height="198" rx="15" fill="none" stroke="#ffa657" stroke-opacity="0.45" stroke-width="1.5"/>
</svg>
