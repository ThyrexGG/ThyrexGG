<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Thyrak - Computer Science Student and Full-Stack Developer">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a0f1f"/><stop offset="0.5" stop-color="#141b36"/><stop offset="1" stop-color="#0a0f1f"/>
  </linearGradient>
  <linearGradient id="ac" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="500" y2="0" spreadMethod="reflect">
    <stop offset="0" stop-color="#58a6ff"/><stop offset="0.5" stop-color="#bc8cff"/><stop offset="1" stop-color="#ff7b72"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1000 0" dur="7s" repeatCount="indefinite"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#58a6ff" stroke-opacity="0.09"/>
  </pattern>
  <radialGradient id="orbA"><stop offset="0" stop-color="#58a6ff" stop-opacity="0.35"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="orbB"><stop offset="0" stop-color="#bc8cff" stop-opacity="0.30"/><stop offset="1" stop-color="#bc8cff" stop-opacity="0"/></radialGradient>
  <radialGradient id="orbC"><stop offset="0" stop-color="#ff7b72" stop-opacity="0.22"/><stop offset="1" stop-color="#ff7b72" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="frame"><rect width="1000" height="280" rx="20"/></clipPath>
</defs>
<g clip-path="url(#frame)" font-family="ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace">
  <rect width="1000" height="280" fill="url(#bg)"/>
  <rect width="1000" height="280" fill="url(#grid)"/>
  <circle r="170" cy="90" fill="url(#orbA)"><animate attributeName="cx" values="150;420;150" dur="14s" repeatCount="indefinite"/></circle>
  <circle r="190" cy="200" fill="url(#orbB)"><animate attributeName="cx" values="850;560;850" dur="17s" repeatCount="indefinite"/></circle>
  <circle r="140" cy="140" fill="url(#orbC)"><animate attributeName="cx" values="500;700;300;500" dur="21s" repeatCount="indefinite"/></circle>
  <text x="35" y="300" font-size="14" fill="#58a6ff" opacity="0">{ }<animate attributeName="y" values="300;-20" dur="12.7s" begin="-3.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.45;0.45;0" keyTimes="0;0.15;0.8;1" dur="12.7s" begin="-3.9s" repeatCount="indefinite"/></text><text x="122" y="300" font-size="14" fill="#bc8cff" opacity="0">&lt;/&gt;<animate attributeName="y" values="300;-20" dur="10.2s" begin="-3.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.45;0.45;0" keyTimes="0;0.15;0.8;1" dur="10.2s" begin="-3.7s" repeatCount="indefinite"/></text><text x="168" y="300" font-size="16" fill="#58a6ff" opacity="0">01<animate attributeName="y" values="300;-20" dur="7.5s" begin="-4.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.45;0.45;0" keyTimes="0;0.15;0.8;1" dur="7.5s" begin="-4.2s" repeatCount="indefinite"/></text><text x="255" y="300" font-size="14" fill="#bc8cff" opacity="0">=&gt;<animate attributeName="y" values="300;-20" dur="9.5s" begin="-8.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.45;0.45;0" keyTimes="0;0.15;0.8;1" dur="9.5s" begin="-8.3s" repeatCount="indefinite"/></text><text x="329" y="300" font-size="20" fill="#58a6ff" opacity="0">async<animate attributeName="y" values="300;-20" dur="10.8s" begin="-9.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.45;0.45;0" keyTimes="0;0.15;0.8;1" dur="10.8s" begin="-9.5s" repeatCount="indefinite"/></text><text x="387" y="300" font-size="18" fill="#3fb950" opacity="0">SELECT<animate attributeName="y" values="300;-20" dur="7.3s" begin="-8.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.45;0.45;0" keyTimes="0;0.15;0.8;1" dur="7.3s" begin="-8.6s" repeatCount="indefinite"/></text><text x="455" y="300" font-size="16" fill="#58a6ff" opacity="0">git<animate attributeName="y" values="300;-20" dur="10.2s" begin="-5.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.45;0.45;0" keyTimes="0;0.15;0.8;1" dur="10.2s" begin="-5.7s" repeatCount="indefinite"/></text><text x="540" y="300" font-size="14" fill="#58a6ff" opacity="0">npm<animate attributeName="y" values="300;-20" dur="10.4s" begin="-1.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.45;0.45;0" keyTimes="0;0.15;0.8;1" dur="10.4s" begin="-1.9s" repeatCount="indefinite"/></text><text x="611" y="300" font-size="20" fill="#ff7b72" opacity="0">[ ]<animate attributeName="y" values="300;-20" dur="7.4s" begin="-2.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.45;0.45;0" keyTimes="0;0.15;0.8;1" dur="7.4s" begin="-2.1s" repeatCount="indefinite"/></text><text x="678" y="300" font-size="18" fill="#bc8cff" opacity="0">&amp;&amp;<animate attributeName="y" values="300;-20" dur="10.5s" begin="-4.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.45;0.45;0" keyTimes="0;0.15;0.8;1" dur="10.5s" begin="-4.5s" repeatCount="indefinite"/></text><text x="760" y="300" font-size="14" fill="#ff7b72" opacity="0">fn()<animate attributeName="y" values="300;-20" dur="8.1s" begin="-7.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.45;0.45;0" keyTimes="0;0.15;0.8;1" dur="8.1s" begin="-7.8s" repeatCount="indefinite"/></text><text x="822" y="300" font-size="20" fill="#ff7b72" opacity="0">await<animate attributeName="y" values="300;-20" dur="10.0s" begin="-3.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.45;0.45;0" keyTimes="0;0.15;0.8;1" dur="10.0s" begin="-3.4s" repeatCount="indefinite"/></text><text x="896" y="300" font-size="20" fill="#bc8cff" opacity="0">::<animate attributeName="y" values="300;-20" dur="12.9s" begin="-1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.45;0.45;0" keyTimes="0;0.15;0.8;1" dur="12.9s" begin="-1.2s" repeatCount="indefinite"/></text><text x="52" y="300" font-size="20" fill="#58a6ff" opacity="0">#!<animate attributeName="y" values="300;-20" dur="9.1s" begin="-9.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.45;0.45;0" keyTimes="0;0.15;0.8;1" dur="9.1s" begin="-9.3s" repeatCount="indefinite"/></text>
  <rect x="0" y="0" width="1000" height="3" fill="#58a6ff" opacity="0.25">
    <animate attributeName="y" values="-4;280" dur="5s" repeatCount="indefinite"/>
  </rect>
  <text x="500" y="135" text-anchor="middle" font-size="88" font-weight="800" letter-spacing="16" fill="url(#ac)" filter="url(#glow)" opacity="0">THYRAK
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
    <animate attributeName="y" from="160" to="135" dur="1.2s" fill="freeze"/>
  </text>
  <text x="500" y="192" text-anchor="middle" font-size="25" fill="#c9d1d9" opacity="0">Computer Science Student<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.000;0.000;0.030;0.220;0.250;1.000" dur="12s" repeatCount="indefinite"/></text><text x="500" y="192" text-anchor="middle" font-size="25" fill="#c9d1d9" opacity="0">Full-Stack Developer<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.000;0.250;0.280;0.470;0.500;1.000" dur="12s" repeatCount="indefinite"/></text><text x="500" y="192" text-anchor="middle" font-size="25" fill="#c9d1d9" opacity="0">Mobile and Desktop App Builder<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.000;0.500;0.530;0.720;0.750;1.000" dur="12s" repeatCount="indefinite"/></text><text x="500" y="192" text-anchor="middle" font-size="25" fill="#c9d1d9" opacity="0">Backend and System Design Enthusiast<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.000;0.750;0.780;0.970;1.000;1.000" dur="12s" repeatCount="indefinite"/></text>
  <rect x="380" y="214" width="0" height="3" rx="1.5" fill="url(#ac)">
    <animate attributeName="width" from="0" to="240" dur="1s" begin="0.8s" fill="freeze"/>
  </rect>
  <text x="500" y="254" text-anchor="middle" font-size="14" fill="#8b949e">// building something new every day</text>
</g>
<rect x="1" y="1" width="998" height="278" rx="20" fill="none" stroke="url(#ac)" stroke-opacity="0.7" stroke-width="2"/>
</svg>
