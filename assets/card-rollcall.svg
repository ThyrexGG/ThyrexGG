<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" width="420" height="200" role="img" aria-label="Rollcall: Attendance tracking for a volleyball club. Offline-first.">
<defs>
  <linearGradient id="g-rollcall" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3fb950"/><stop offset="1" stop-color="#58a6ff"/></linearGradient>
  <linearGradient id="bg-rollcall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#151b2b"/></linearGradient>
  <radialGradient id="o-rollcall"><stop offset="0" stop-color="#58a6ff" stop-opacity="0.32"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></radialGradient>
  <pattern id="p-rollcall" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#3fb950" stroke-opacity="0.07"/></pattern>
  <clipPath id="f-rollcall"><rect width="420" height="200" rx="16"/></clipPath>
</defs>
<g clip-path="url(#f-rollcall)" font-family="ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace">
  <rect width="420" height="200" fill="url(#bg-rollcall)"/>
  <rect width="420" height="200" fill="url(#p-rollcall)"/>
  <circle cy="40" r="120" fill="url(#o-rollcall)"><animate attributeName="cx" values="360;300;360" dur="9s" repeatCount="indefinite"/></circle>
  <rect width="420" height="4" fill="url(#g-rollcall)"/>
  <text x="24" y="34" font-size="12" fill="#8b949e">// 01 · pwa / attendance</text>
  <text x="24" y="78" font-size="32" font-weight="800" fill="url(#g-rollcall)">Rollcall</text>
  <text x="24" y="104" font-size="13" fill="#c9d1d9">Attendance tracking for a</text>
  <text x="24" y="122" font-size="13" fill="#c9d1d9">volleyball club. Offline-first.</text>
  <rect x="24" y="150" width="59" height="26" rx="13" fill="#3fb950" fill-opacity="0.12" stroke="#3fb950" stroke-opacity="0.55"/><text x="53.5" y="167" text-anchor="middle" font-size="12" fill="#e6edf3">React</text><rect x="91" y="150" width="81" height="26" rx="13" fill="#3fb950" fill-opacity="0.12" stroke="#3fb950" stroke-opacity="0.55"/><text x="131.5" y="167" text-anchor="middle" font-size="12" fill="#e6edf3">Supabase</text><rect x="180" y="150" width="44" height="26" rx="13" fill="#3fb950" fill-opacity="0.12" stroke="#3fb950" stroke-opacity="0.55"/><text x="202.0" y="167" text-anchor="middle" font-size="12" fill="#e6edf3">PWA</text>
</g>
<rect x="1" y="1" width="418" height="198" rx="15" fill="none" stroke="#3fb950" stroke-opacity="0.45" stroke-width="1.5"/>
</svg>
