<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 40" width="168" height="40" role="img" aria-label="Live demo">
<defs>
  <clipPath id="b"><rect x="1" y="1" width="166" height="38" rx="8"/></clipPath>
  <linearGradient id="s" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<rect x="1" y="1" width="166" height="38" rx="8" fill="#12261a" stroke="#3fb950" stroke-width="1.5"/>
<g clip-path="url(#b)"><rect y="0" width="44" height="40" fill="url(#s)" transform="skewX(-20)"><animate attributeName="x" values="-70;200;200" keyTimes="0;0.45;1" dur="3.6s" repeatCount="indefinite"/></rect></g>
<circle cx="24" cy="20" r="4" fill="#3fb950"/>
<circle cx="24" cy="20" r="4" fill="none" stroke="#3fb950" stroke-width="1.5"><animate attributeName="r" values="4;11" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="1.6s" repeatCount="indefinite"/></circle>
<text x="42" y="25" font-size="13" font-weight="700" letter-spacing="1.4" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace">LIVE DEMO</text>
<text x="142" y="25" font-size="16" font-weight="700" fill="#3fb950" font-family="ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace">↗<animateTransform attributeName="transform" type="translate" values="0 0;3 -3;0 0" dur="1.6s" repeatCount="indefinite"/></text>
</svg>
